name: Offline tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_demo_backtest.py --seed 7 --out-dir runs/ci
      - run: python scripts/evaluate_kalshi.py --quotes docs/kalshi_quote_sample.csv --out-dir runs/benchmark
